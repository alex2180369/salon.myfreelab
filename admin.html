<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef"><title>Заявки — Maison de beauté</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f7f4ef;--card:#fffdfa;--ink:#302b27;--muted:#81776d;--line:#e9e1d8;--clay:#9b745f;--sage:#66776a;--sans:'DM Sans',Arial,sans-serif;--serif:'Playfair Display',Georgia,serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans)}.wrap{max-width:1180px;margin:auto;padding:32px 28px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font:500 28px var(--serif)}.brand small{display:block;font:10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--clay);margin-top:5px}.tools{display:flex;gap:10px;align-items:center}button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:4px;cursor:pointer}button:hover{border-color:var(--clay)}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.summary{display:flex;gap:12px;margin:24px 0}.metric{background:var(--card);border:1px solid var(--line);padding:18px 20px;min-width:170px}.metric strong{display:block;font:500 27px var(--serif)}.metric span{font-size:11px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);margin:12px 0 20px}.notice.warn{color:#92523e;background:#f2e8e3;padding:12px}.requests{display:grid;gap:14px}.request{background:var(--card);border:1px solid var(--line);padding:20px 22px}.request-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.identity{font-size:18px;font-weight:600}.phone{color:var(--clay);margin-top:4px}.meta{color:var(--muted);font-size:11px;margin-top:7px}.status{display:flex;align-items:center;gap:8px}.status select{padding:8px;font-size:12px}.id{font-size:12px;color:var(--muted)}.items{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:grid;grid-template-columns:1fr auto;gap:8px}.item{padding:3px 0}.item small{display:block;color:var(--muted);margin-top:3px}.total{font-weight:700;white-space:nowrap}.comment{margin-top:14px;color:var(--muted);font-size:12px;white-space:pre-wrap}.history{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.history summary{cursor:pointer;color:var(--clay);font-size:12px}.history-list{font-size:11px;color:var(--muted);line-height:1.8;padding:8px 0 0 15px}.empty{background:var(--card);text-align:center;padding:54px;color:var(--muted)}.loading{color:var(--muted);padding:25px}.error{color:#92523e}.footer{margin-top:28px;color:var(--muted);font-size:10px}
    @media(max-width:650px){.wrap{padding:20px 14px}.top{align-items:flex-start;gap:12px}.brand{font-size:22px}.tools{flex-direction:column;align-items:stretch}.summary{display:grid;grid-template-columns:repeat(2,1fr)}.metric{min-width:0;padding:14px}.request{padding:16px}.request-head{display:block}.status{margin-top:12px;justify-content:space-between}.items{grid-template-columns:1fr auto}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand">Maison de beauté<small>Панель администратора</small></div><div class="tools"><a href="/" style="color:var(--clay);font-size:12px">Открыть меню</a><button class="primary" id="refresh">Обновить заявки</button></div></header>
  <section class="summary"><div class="metric"><strong id="today-count">—</strong><span>заявок сегодня</span></div><div class="metric"><strong id="all-count">—</strong><span>последних заявок в списке</span></div></section>
  <p class="notice" id="telegram-state">Подключение к локальной базе…</p><section id="requests" class="requests"><div class="loading">Загружаем заявки…</div></section>
  <p class="footer">Данные хранятся в локальной базе SQLite на этом компьютере. Автообновление каждые 5 секунд.</p>
</main><script>
const labels={new:'Новая',accepted:'Принята',completed:'Завершена',cancelled:'Отменена'};
const money=value=>new Intl.NumberFormat('ru-RU').format(value)+' ₽';
const phoneLabel=value=>{const digits=String(value||'').replace(/\D/g,'');return digits.length===11&&digits[0]==='7'?`+7 ${digits.slice(1,4)} ${digits.slice(4,7)}-${digits.slice(7,9)}-${digits.slice(9)}`:`+${digits}`};
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function renderRequest(order){const date=new Date(order.createdAt).toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short'});const items=order.items.map(item=>`<div class="item">${escapeHtml(item.name)} × ${item.quantity}${item.comment?`<small>${escapeHtml(item.comment)}</small>`:''}</div><div class="total">${item.price==null?'уточнить':money(item.price*item.quantity)}</div>`).join('');const history=order.customer.history.length?`<details class="history" open><summary>История клиента — ${order.customer.previousRequests} прошлых заявок</summary><div class="history-list">${order.customer.history.map(old=>`№${old.id} · ${new Date(old.createdAt).toLocaleDateString('ru-RU')} · ${escapeHtml(old.summary||'без позиций')} · ${money(old.total)}`).join('<br>')}</div></details>`:'<div class="meta">Первый заказ клиента</div>';return `<article class="request" data-id="${order.id}"><div class="request-head"><div><div class="identity">${escapeHtml(order.customer.name)}</div><div class="phone">${escapeHtml(phoneLabel(order.customer.phone))}</div><div class="meta">${date} · заявка №${order.id} · ${order.customer.previousRequests?'повторный клиент':'новый клиент'}</div></div><div class="status"><span class="id">${money(order.total)}</span><select aria-label="Статус заявки ${order.id}" data-status-id="${order.id}">${Object.entries(labels).map(([key,label])=>`<option value="${key}" ${order.status===key?'selected':''}>${label}</option>`).join('')}</select></div></div><div class="items">${items}<div class="total">Итого</div><div class="total">${money(order.total)}</div></div>${order.comment?`<div class="comment">Комментарий клиента: ${escapeHtml(order.comment)}</div>`:''}${history}</article>`}
async function refresh(){const root=document.getElementById('requests');try{const response=await fetch('/api/requests');if(!response.ok)throw new Error('Сервер недоступен');const data=await response.json();const orders=data.requests;const today=new Date().toLocaleDateString('ru-RU');document.getElementById('all-count').textContent=orders.length;document.getElementById('today-count').textContent=orders.filter(x=>new Date(x.createdAt).toLocaleDateString('ru-RU')===today).length;const state=document.getElementById('telegram-state');state.textContent=data.telegramConfigured?'Telegram-уведомления настроены.':'Заявки сохраняются локально; Telegram пока не настроен.';state.className=data.telegramConfigured?'notice':'notice warn';root.innerHTML=orders.length?orders.map(renderRequest).join(''):'<div class="empty">Заявок пока нет. Отправьте тестовый запрос из меню.</div>';}catch(error){root.innerHTML=`<div class="empty error">${escapeHtml(error.message)}. Запустите локальный сервер: node server.js</div>`}}
document.getElementById('refresh').addEventListener('click',refresh);document.addEventListener('change',async event=>{const id=event.target.dataset.statusId;if(!id)return;const response=await fetch(`/api/requests/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:event.target.value})});if(!response.ok){alert('Не удалось обновить статус заявки.');refresh()}});refresh();setInterval(refresh,5000);
</script></body></html>
